<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الدفع (وضع تجريبي) | شركة درة فارس الشمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #0f0c29, #1a1a2e); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .pay-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 40px 30px; max-width: 550px; width: 100%; backdrop-filter: blur(10px); }
        .pay-icon { font-size: 70px; margin-bottom: 15px; }
        .pay-card h1 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
        .pay-card p { color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 18px; line-height: 1.7; }

        /* 🧪 شارة الوضع التجريبي */
        .test-badge { background: rgba(245,158,11,0.12); border: 2px dashed #F59E0B; color: #F59E0B; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 800; margin-bottom: 18px; line-height: 1.8; }

        /* ملخص الطلب */
        .pay-summary { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.3); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
        .pay-summary .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; color: rgba(255,255,255,0.75); }
        .pay-summary .row strong { color: #fff; }
        .pay-summary .amount { color: #10B981; font-size: 22px; font-weight: 900; }

        .btn { display: inline-block; width: 100%; padding: 16px 25px; border-radius: 14px; font-weight: 800; text-decoration: none; margin: 8px 0; transition: 0.3s; font-size: 16px; border: none; cursor: pointer; font-family: inherit; }
        .btn-success { background: linear-gradient(135deg, #10B981, #059669); color: #fff; }
        .btn-fail { background: rgba(239,68,68,0.15); color: #EF4444; border: 2px solid rgba(239,68,68,0.4); }
        .btn:hover { transform: translateY(-2px); }
        .btn-success:hover { box-shadow: 0 10px 30px rgba(16,185,129,0.3); }
        .btn-fail:hover { background: rgba(239,68,68,0.3); }
    </style>
</head>
<body>
    <div class="pay-card">
        <div class="pay-icon">💳</div>
        <h1>بوابة الدفع</h1>
        <p>مراجعة عملية الدفع قبل التأكيد</p>

        <!-- 🧪 شارة الوضع التجريبي -->
        <div class="test-badge">🧪 وضع تجريبي — لا يوجد خصم حقيقي<br><small style="font-weight:600;font-size:12px;opacity:0.85">هذه الصفحة تحاكي بوابة الدفع لأغراض الاختبار فقط</small></div>

        <!-- ملخص العملية -->
        <div class="pay-summary">
            <div class="row"><span>رقم الطلب</span><strong id="orderRef">...</strong></div>
            <div class="row"><span>البوابة</span><strong id="gatewayName">...</strong></div>
            <div class="row"><span>المبلغ المطلوب</span><span class="amount" id="payAmount">...</span></div>
        </div>

        <!-- أزرار المحاكاة -->
        <button class="btn btn-success" id="btnSuccess">✅ محاكاة نجاح الدفع</button>
        <button class="btn btn-fail" id="btnFail">❌ محاكاة فشل الدفع</button>
    </div>

<script src="test-payment.js"></script>
    <script src="config.js"></script>
<script src="main.js"></script>
    <script src="chatbot-ai.js"></script>
    <script src="site-content.js"></script>
</body>
</html>
