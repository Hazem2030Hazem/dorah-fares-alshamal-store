<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فاتورة ضريبية — Tax Invoice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --ink:#111827; --line:#9CA3AF; --head:#F3F4F6; }
  * { box-sizing: border-box; }
  body { font-family: 'Tajawal','Cairo',Tahoma,Arial,sans-serif; color: var(--ink);
         background: #E5E7EB; margin: 0; padding: 16px; }
  .sheet { background: #fff; width: 210mm; min-height: 290mm; margin: 0 auto;
           padding: 10mm 12mm; box-shadow: 0 2px 14px rgba(0,0,0,.18); }
  /* هيدر: شعار+اسم الشركة يمين، QR يسار */
  .hdr { display: flex; justify-content: space-between; align-items: flex-start;
         border-bottom: 2.5px solid var(--ink); padding-bottom: 8px; }
  .hdr .co { text-align: right; }
  .hdr .co img { max-height: 64px; max-width: 180px; display: block; margin-bottom: 4px; }
  .hdr .co h1 { font-size: 20px; margin: 0; font-weight: 800; }
  .hdr .co .en { font-size: 12px; color: #4B5563; }
  .hdr .qr { text-align: center; }
  .hdr .qr #qrbox img, .hdr .qr #qrbox canvas { display: block; }
  .hdr .qr .cap { font-size: 10px; color: #4B5563; margin-top: 2px; }
  .doctitle { text-align: center; font-size: 22px; font-weight: 800; margin: 10px 0 8px; }
  .doctitle small { font-size: 14px; font-weight: 500; color: #4B5563; }
  /* صف البيانات */
  .meta { display: flex; gap: 8px; margin-bottom: 10px; }
  .meta .col { flex: 1; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .meta .col h3 { background: var(--head); margin: 0; padding: 5px 8px; font-size: 13px;
                  border-bottom: 1px solid var(--line); }
  .meta .row { display: flex; justify-content: space-between; padding: 3px 8px;
               font-size: 12px; border-bottom: 1px dashed #E5E7EB; }
  .meta .row:last-child { border-bottom: 0; }
  .meta .row b { font-weight: 700; }
  .meta .row span:first-child { color: #4B5563; }
  /* جدول الأصناف */
  table.items { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.items th, table.items td { border: 1px solid var(--line); padding: 4px 4px;
                                   text-align: center; }
  table.items thead th { background: var(--head); font-weight: 700; font-size: 10.5px; }
  table.items td.desc { text-align: right; }
  /* الإجماليات */
  .foot { display: flex; gap: 10px; margin-top: 10px; align-items: flex-start; }
  .foot .tafqeet { flex: 1.4; border: 1px solid var(--line); border-radius: 6px;
                   padding: 8px; font-size: 12px; min-height: 60px; }
  .foot .tafqeet h4 { margin: 0 0 4px; font-size: 12px; color: #4B5563; }
  .foot .pay { margin-top: 8px; font-size: 12px; }
  table.totals { flex: 1; border-collapse: collapse; font-size: 13px; }
  table.totals td { border: 1px solid var(--line); padding: 5px 8px; }
  table.totals td:last-child { text-align: center; font-weight: 700; min-width: 90px; }
  table.totals tr.grand td { background: var(--head); font-size: 15px; font-weight: 800; }
  .thanks { text-align: center; margin-top: 14px; font-size: 12px; color: #4B5563; }
  .policy { text-align: center; margin-top: 10px; font-size: 12px; font-weight: 700; color: #374151;
    border-top: 1px dashed var(--line); padding-top: 10px; }
  .signs { display: flex; justify-content: space-between; margin-top: 26px; font-size: 12px;
    color: #374151; text-align: center; }
  .signs div { flex: 1; }
  .err { max-width: 640px; margin: 60px auto; background: #FEF2F2; color: #991B1B;
         padding: 20px; border-radius: 10px; text-align: center; font-size: 15px; }
  /* شريط الأدوات (لا يُطبع) */
  .toolbar { width: 210mm; margin: 0 auto 10px; display: flex; gap: 8px; }
  .toolbar button { padding: 8px 22px; font-size: 15px; font-family: inherit;
                    border: 0; border-radius: 8px; cursor: pointer;
                    background: #1D4ED8; color: #fff; font-weight: 700; }
  .toolbar button.ghost { background: #fff; color: #111827; border: 1px solid var(--line); }
  @page { size: A4; margin: 8mm; }
  @media print {
    body { background: #fff; padding: 0; }
    .sheet { box-shadow: none; width: auto; min-height: auto; padding: 0; margin: 0; }
    .toolbar { display: none; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">🖨️ طباعة</button>
  <button class="ghost" onclick="window.close()">✖ إغلاق</button>
</div>
<div id="app"><div class="sheet" style="text-align:center;padding-top:40mm">⏳ جاري تحميل الفاتورة...</div></div>

<script>
(function () {
'use strict';
var SUPABASE_URL = 'https://kcbmvxuzjlaooknwhqqb.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjYm12eHV6amxhb29rbndocXFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NzkyMjAsImV4cCI6MjA5OTU1NTIyMH0.ayDpkfCKL90GcUKjbHQs7OvS5sxF1VSraWg58NHJ7ek';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var VAT_RATE = 0.15;

function qs(k) { return new URLSearchParams(location.search).get(k); }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]; }); }
function money(n) { return (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fail(msg) {
  document.getElementById('app').innerHTML = '<div class="err">❌ ' + esc(msg) + '</div>';
}

/* ─── TLV client-side (زاتكا مرحلة 1: وسوم 1-5) ─── */
function tlvBase64(tags) {
  var bytes = [];
  tags.forEach(function (t) {
    var v = unescape(encodeURIComponent(String(t[1] == null ? '' : t[1])));
    bytes.push(t[0] & 0xff, v.length & 0xff);
    for (var i = 0; i < v.length; i++) bytes.push(v.charCodeAt(i));
  });
  var bin = '';
  bytes.forEach(function (b) { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function drawQr(text, size) {
  var box = document.getElementById('qrbox');
  if (!box || !text) return;
  box.innerHTML = '';
  new QRCode(box, { text: text, width: size || 110, height: size || 110,
    correctLevel: QRCode.CorrectLevel.M });
}

/* ─── التفقيط: المبلغ كتابةً بالعربي (ريال/هللة) ─── */
var ONES = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة',
  'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر',
  'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
var TENS = ['', 'عشرة', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
var HUNDS = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة',
  'سبعمائة', 'ثمانمائة', 'تسعمائة'];
function threeDigits(n, feminine) {
  var parts = [], h = Math.floor(n / 100), r = n % 100;
  if (h) parts.push(HUNDS[h]);
  if (r) {
    var one = r % 10;
    if (feminine && r === 1) parts.push('واحدة');
    else if (feminine && r === 2) parts.push('اثنتان');
    else if (r < 20) parts.push(ONES[r]);
    else if (one === 0) parts.push(TENS[Math.floor(r / 10)]);
    else parts.push(ONES[one] + ' و' + TENS[Math.floor(r / 10)]);
  }
  return parts.join(' و');
}
function scaleWord(n, one, two, few, many, feminine) {
  if (n === 1) return one;
  if (n === 2) return two;
  if (n >= 3 && n <= 10) return threeDigits(n, feminine) + ' ' + few;
  return threeDigits(n, feminine) + ' ' + many;
}
function tafqeet(amount) {
  var total = Math.round((Number(amount) || 0) * 100);
  var riyal = Math.floor(total / 100), halala = total % 100;
  var parts = [];
  if (riyal === 0) parts.push('صفر');
  else {
    var groups = [];
    var m = Math.floor(riyal / 1000000), t = Math.floor((riyal % 1000000) / 1000), r = riyal % 1000;
    if (m) groups.push(scaleWord(m, 'مليون', 'مليونان', 'ملايين', 'مليون', false));
    if (t) groups.push(scaleWord(t, 'ألف', 'ألفان', 'آلاف', 'ألفاً', false));
    if (r) groups.push(threeDigits(r, false));
    parts.push(groups.join(' و'));
  }
  var out = 'فقط ' + parts.join('') + ' ريال سعودي';
  if (halala) out += ' و' + threeDigits(halala, true) + ' هللة';
  return out + ' لا غير';
}

/* ─── تحميل البيانات ─── */
async function loadOrder(orderId) {
  // محاولة القراءة المباشرة أولاً (لو سياسات RLS تسمح)
  try {
    var r = await sb.from('store_orders').select('*').eq('id', orderId).maybeSingle();
    if (r.data) {
      var e = await sb.from('e_invoices')
        .select('qr_tlv,uuid,icv,invoice_kind,status,entity_id,created_at')
        .eq('order_id', orderId).maybeSingle();
      return { order: r.data, einvoice: e.data || null };
    }
  } catch (_) {}
  // المسار العادي: RPC عامة (RLS يمنع القراءة المباشرة للزائر)
  var v = await sb.rpc('public_invoice_view', { p_order_id: Number(orderId) });
  if (v.error) throw new Error(v.error.message);
  if (!v.data || v.data.error) throw new Error((v.data && v.data.error) || 'الطلب غير موجود');
  return v.data;
}
async function loadEntity(entityId, einvoice) {
  var id = entityId || (einvoice && einvoice.entity_id) || null;
  var r = await sb.rpc('public_entity_info', { p_id: id });
  if (r.error) return null;
  return r.data;
}

function itemCode(it, i) {
  return it.sku || it.code || it.barcode || it.id || (i + 1);
}
function itemUnit(it) { return it.unit || 'حبة'; }

async function main() {
  var orderId = qs('order');
  if (!orderId) return fail('معامل ?order= مطلوب');
  var data, entity;
  try {
    data = await loadOrder(orderId);
    entity = await loadEntity(qs('entity'), data.einvoice);
  } catch (e) { return fail(e.message); }
  var o = data.order || {};
  var ei = data.einvoice || null;
  entity = entity || {};

  var items = o.items;
  if (typeof items === 'string') { try { items = JSON.parse(items); } catch (_) { items = []; } }
  items = Array.isArray(items) ? items : [];
  var shipFee = Number(o.shipping_fee || o.shipping_cost) || 0;
  var rows = items.map(function (it) {
    var qty = Number(it.qty || it.quantity) || 1;
    var unitPrice = Number(it.price) || 0;
    var discPct = Number(it.discount_pct || it.discount_percent) || 0;
    var gross = qty * unitPrice;
    var disc = Number(it.discount) || (discPct ? gross * discPct / 100 : 0);
    var net = gross - disc;
    var taxPct = it.tax_pct != null ? Number(it.tax_pct) : VAT_RATE * 100;
    var tax = net * taxPct / 100;
    return { it: it, qty: qty, price: unitPrice, gross: gross,
      discPct: discPct, disc: disc, taxPct: taxPct, tax: tax, total: net + tax };
  });
  if (shipFee > 0) {
    rows.push({ it: { name: 'رسوم الشحن والتوصيل', sku: 'SHIPPING' }, qty: 1, price: shipFee,
      gross: shipFee, discPct: 0, disc: 0, taxPct: 0, tax: 0, total: shipFee });
  }
  var sumGross = rows.reduce(function (a, r) { return a + r.gross; }, 0);
  var sumDisc = rows.reduce(function (a, r) { return a + r.disc; }, 0);
  var sumTax = rows.reduce(function (a, r) { return a + r.tax; }, 0);
  var grand = rows.reduce(function (a, r) { return a + r.total; }, 0);
  // إن كانت أرقام الطلب المخزنة أدق نعتمدها للإجمالي النهائي
  var storedTotal = Number(o.total) || 0;
  if (storedTotal > 0 && Math.abs(storedTotal - grand) < 1) grand = storedTotal;
  var storedTax = Number(o.tax) || 0;
  if (storedTax > 0 && Math.abs(storedTax - sumTax) < 1) sumTax = storedTax;

  var dt = o.created_at ? new Date(o.created_at) : new Date();
  var dtStr = dt.toLocaleDateString('ar-SA') + ' ' + dt.toLocaleTimeString('ar-SA',
    { hour: '2-digit', minute: '2-digit' });
  var hijriStr = '—';
  try {
    hijriStr = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',
      { day: '2-digit', month: '2-digit', year: 'numeric' }).format(dt);
  } catch (eH) {}
  var payLbl = { cash: 'نقداً', card: 'شبكة/بطاقة', mada: 'مدى', stc: 'STC Pay',
    apple: 'Apple Pay', transfer: 'تحويل بنكي', cod: 'الدفع عند الاستلام' };
  var sellerName = entity.name || 'شركة درة فارس الشمال للتجارة';
  var sellerVat = entity.vat_number || '';
  var sellerAddr = entity.address ||
    [entity.city, entity.district, entity.street, entity.building_no, entity.postal_code]
      .filter(Boolean).join(' — ');

  var html = '';
  html += '<div class="sheet">';
  html += '<div class="hdr"><div class="co">' +
    (entity.logo_url ? '<img src="' + esc(entity.logo_url) + '" alt="">' : '') +
    '<h1>' + esc(sellerName) + '</h1>' +
    (entity.name_en ? '<div class="en">' + esc(entity.name_en) + '</div>' : '') +
    '</div>' +
    '<div class="qr"><div id="qrbox"></div><div class="cap">رمز التحقق — زاتكا</div></div></div>';
  html += '<div class="doctitle">فاتورة ضريبية <small>/ Tax Invoice</small></div>';
  html += '<div class="meta"><div class="col"><h3>بيانات البائع</h3>' +
    '<div class="row"><span>الفرع</span><b>' + esc(entity.branch_name || 'الرئيسي') + '</b></div>' +
    '<div class="row"><span>العنوان</span><b>' + esc(sellerAddr || '—') + '</b></div>' +
    '<div class="row"><span>الرقم الضريبي</span><b dir="ltr">' + esc(sellerVat || '—') + '</b></div>' +
    '<div class="row"><span>السجل التجاري</span><b dir="ltr">' + esc(entity.cr_number || '—') + '</b></div>' +
    '<div class="row"><span>رقم الفاتورة</span><b>' + esc(o.order_number || o.id) + '</b></div>' +
    '<div class="row"><span>التاريخ</span><b>' + esc(dtStr) + '</b></div>' +
    '<div class="row"><span>التاريخ هجري</span><b>' + esc(hijriStr) + '</b></div>' +
    '<div class="row"><span>المندوب</span><b>' + esc(o.sales_rep || o.cashier_name || '—') + '</b></div>' +
    '</div>';
  html += '<div class="col"><h3>بيانات العميل</h3>' +
    '<div class="row"><span>العميل</span><b>' + esc(o.customer_name || 'عميل نقدي') + '</b></div>' +
    '<div class="row"><span>الجوال</span><b dir="ltr">' + esc(o.customer_phone || '—') + '</b></div>' +
    '<div class="row"><span>العنوان</span><b>' + esc(o.shipping_city || o.customer_address || '—') + '</b></div>' +
    '<div class="row"><span>الرقم الضريبي</span><b dir="ltr">' + esc(o.customer_vat || o.buyer_vat || '—') + '</b></div>' +
    '<div class="row"><span>السجل التجاري</span><b dir="ltr">' + esc(o.customer_cr || '—') + '</b></div>' +
    '</div></div>';
  html += '<table class="items"><thead><tr>' +
    '<th>م</th><th>كود الصنف</th><th>الوصف</th><th>الوحدة</th><th>الكمية</th>' +
    '<th>سعر الوحدة</th><th>إجمالي المبلغ</th><th>نسبة خصم</th><th>خصم</th>' +
    '<th>نسبة الضريبة</th><th>ضريبة القيمة المضافة</th><th>الإجمالي</th>' +
    '</tr></thead><tbody>';
  rows.forEach(function (r, i) {
    html += '<tr><td>' + (i + 1) + '</td>' +
      '<td dir="ltr">' + esc(itemCode(r.it, i)) + '</td>' +
      '<td class="desc">' + esc(r.it.name || r.it.title || 'صنف') + '</td>' +
      '<td>' + esc(itemUnit(r.it)) + '</td>' +
      '<td>' + r.qty + '</td>' +
      '<td>' + money(r.price) + '</td>' +
      '<td>' + money(r.gross) + '</td>' +
      '<td>' + (r.discPct ? r.discPct + '%' : '—') + '</td>' +
      '<td>' + (r.disc ? money(r.disc) : '—') + '</td>' +
      '<td>' + r.taxPct + '%</td>' +
      '<td>' + money(r.tax) + '</td>' +
      '<td><b>' + money(r.total) + '</b></td></tr>';
  });
  html += '</tbody></table>';
  html += '<div class="foot">' +
    '<div class="tafqeet"><h4>المبلغ كتابةً (التفقيط)</h4><b>' + esc(tafqeet(grand)) + '</b>' +
    '<div class="pay">طريقة الدفع: <b>' + esc(payLbl[o.payment_method] || o.payment_method || '—') + '</b></div>' +
    (ei ? '<div class="pay">فاتورة إلكترونية: ICV <b>' + ei.icv + '</b> — ' + esc(ei.invoice_kind === 'standard' ? 'قياسية' : 'مبسطة') + '</div>' : '') +
    '</div>' +
    '<table class="totals">' +
    '<tr><td>الإجمالي قبل الضريبة</td><td>' + money(sumGross - sumDisc) + '</td></tr>' +
    '<tr><td>الخصم</td><td>' + money(sumDisc) + '</td></tr>' +
    '<tr><td>ضريبة القيمة المضافة (15%)</td><td>' + money(sumTax) + '</td></tr>' +
    '<tr class="grand"><td>الإجمالي النهائي</td><td>' + money(grand) + ' ر.س</td></tr>' +
    '</table></div>';
  html += '<div class="thanks">شكراً لتعاملكم معنا — هذه الفاتورة صادرة إلكترونياً ولا تحتاج توقيعاً أو ختماً</div>';
  html += '<div class="policy">الارجاع او الاستبدال بفاتورة فقط</div>';
  html += '<div class="signs">' +
    '<div>أعدت بواسطة<br><br>....................</div>' +
    '<div>المراجع<br><br>....................</div>' +
    '<div>المستلم<br><br>....................</div>' +
    '</div>';
  html += '</div>';
  document.getElementById('app').innerHTML = html;

  // QR: من e_invoices.qr_tlv إن وُجد، وإلا TLV عميل (وسوم 1-5)
  var tlv = ei && ei.qr_tlv;
  if (!tlv) {
    tlv = tlvBase64([
      [1, sellerName], [2, sellerVat], [3, dt.toISOString()],
      [4, grand.toFixed(2)], [5, sumTax.toFixed(2)]
    ]);
  }
  drawQr(tlv, 110);
  document.title = 'فاتورة ' + (o.order_number || o.id);

  if (qs('autoprint') === '1') setTimeout(function () { window.print(); }, 600);
}
main();
})();
</script>
</body>
</html>
