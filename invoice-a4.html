<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فاتورة ضريبية — Tax Invoice</title>
  <script src="analytics.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --ink:#111827; --line:#9CA3AF; --head:#F3F4F6; }
  * { box-sizing: border-box; }
  body { font-family: 'Tajawal','Cairo',Tahoma,Arial,sans-serif; color: var(--ink);
         background: #E5E7EB; margin: 0; padding: 16px; }
  .sheet { background: #fff; width: 210mm; min-height: 290mm; margin: 0 auto;
           padding: 10mm 12mm; box-shadow: 0 2px 14px rgba(0,0,0,.18); }
  /* هيدر: شعار+اسم الشركة يمين، QR يسار */
  .hdr { display: flex; justify-content: space-between; align-items: flex-start;
         border-bottom: 2.5px solid var(--ink); padding-bottom: 8px; }
  .hdr .co { text-align: right; }
  .hdr .co img { max-height: 64px; max-width: 180px; display: block; margin-bottom: 4px; }
  .hdr .co h1 { font-size: 20px; margin: 0; font-weight: 800; }
  .hdr .co .en { font-size: 12px; color: #4B5563; }
  .hdr .qr { text-align: center; }
  .hdr .qr #qrbox img, .hdr .qr #qrbox canvas { display: block; }
  .hdr .qr .cap { font-size: 10px; color: #4B5563; margin-top: 2px; }
  .doctitle { text-align: center; font-size: 22px; font-weight: 800; margin: 10px 0 8px; }
  .doctitle small { font-size: 14px; font-weight: 500; color: #4B5563; }
  /* صف البيانات */
  .meta { display: flex; gap: 8px; margin-bottom: 10px; }
  .meta .col { flex: 1; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .meta .col h3 { background: var(--head); margin: 0; padding: 5px 8px; font-size: 13px;
                  border-bottom: 1px solid var(--line); }
  .meta .row { display: flex; justify-content: space-between; padding: 3px 8px;
               font-size: 12px; border-bottom: 1px dashed #E5E7EB; }
  .meta .row:last-child { border-bottom: 0; }
  .meta .row b { font-weight: 700; }
  .meta .row span:first-child { color: #4B5563; }
  /* جدول الأصناف */
  table.items { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.items th, table.items td { border: 1px solid var(--line); padding: 4px 4px;
                                   text-align: center; }
  table.items thead th { background: var(--head); font-weight: 700; font-size: 10.5px; }
  table.items td.desc { text-align: right; }
  /* الإجماليات */
  .foot { display: flex; gap: 10px; margin-top: 10px; align-items: flex-start; }
  .foot .tafqeet { flex: 1.4; border: 1px solid var(--line); border-radius: 6px;
                   padding: 8px; font-size: 12px; min-height: 60px; }
  .foot .tafqeet h4 { margin: 0 0 4px; font-size: 12px; color: #4B5563; }
  .foot .pay { margin-top: 8px; font-size: 12px; }
  table.totals { flex: 1; border-collapse: collapse; font-size: 13px; }
  table.totals td { border: 1px solid var(--line); padding: 5px 8px; }
  table.totals td:last-child { text-align: center; font-weight: 700; min-width: 90px; }
  table.totals tr.grand td { background: var(--head); font-size: 15px; font-weight: 800; }
  .thanks { text-align: center; margin-top: 14px; font-size: 12px; color: #4B5563; }
  .policy { text-align: center; margin-top: 10px; font-size: 12px; font-weight: 700; color: #374151;
    border-top: 1px dashed var(--line); padding-top: 10px; }
  .signs { display: flex; justify-content: space-between; margin-top: 26px; font-size: 12px;
    color: #374151; text-align: center; }
  .signs div { flex: 1; }
  .err { max-width: 640px; margin: 60px auto; background: #FEF2F2; color: #991B1B;
         padding: 20px; border-radius: 10px; text-align: center; font-size: 15px; }
  /* شريط الأدوات (لا يُطبع) */
  .toolbar { width: 210mm; margin: 0 auto 10px; display: flex; gap: 8px; }
  .toolbar button { padding: 8px 22px; font-size: 15px; font-family: inherit;
                    border: 0; border-radius: 8px; cursor: pointer;
                    background: #1D4ED8; color: #fff; font-weight: 700; }
  .toolbar button.ghost { background: #fff; color: #111827; border: 1px solid var(--line); }
  @page { size: A4; margin: 8mm; }
  @media print {
    body { background: #fff; padding: 0; }
    .sheet { box-shadow: none; width: auto; min-height: auto; padding: 0; margin: 0; }
    .toolbar { display: none; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">🖨️ طباعة</button>
  <button class="ghost" onclick="window.close()">✖ إغلاق</button>
</div>
<div id="app"><div class="sheet" style="text-align:center;padding-top:40mm">⏳ جاري تحميل الفاتورة...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="invoice-a4.js"></script>
</body>
</html>
