<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفاتورة الإلكترونية | درة فارس الشمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; min-height: 100vh; padding: 40px 20px; }
        .invoice-container { max-width: 800px; margin: 0 auto; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 40px; }
        .invoice-header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .invoice-header h1 { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
        .invoice-header p { color: rgba(255,255,255,0.7); font-size: 14px; }
        .invoice-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .meta-box { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 16px; }
        .meta-box h4 { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 4px; }
        .meta-box p { font-size: 14px; font-weight: 700; }
        .qr-section { text-align: center; margin: 30px 0; padding: 30px; background: rgba(255,255,255,0.03); border-radius: 16px; }
        .qr-code { width: 200px; height: 200px; margin: 0 auto 16px; background: #fff; border-radius: 12px; padding: 10px; }
        .status-badge { display: inline-block; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 700; }
        .status-pending { background: rgba(245,158,11,0.15); color: #F59E0B; }
        .status-cleared { background: rgba(16,185,129,0.15); color: #10B981; }
        .status-reported { background: rgba(14,165,233,0.15); color: #0EA5E9; }
        .actions { display: flex; gap: 12px; justify-content: center; margin-top: 30px; }
        .btn { padding: 14px 28px; border-radius: 12px; border: none; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #0EA5E9, #3B82F6); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="invoice-container">
        <div class="invoice-header">
            <h1>🧾 فاتورة ضريبية مبسطة</h1>
            <p>مُصدَّرة وفقاً لمتطلبات هيئة الزكاة والضريبة والجمارك (ZATCA)</p>
        </div>

        <div class="invoice-meta">
            <div class="meta-box">
                <h4>رقم الفاتورة</h4>
                <p id="invoiceNumber">—</p>
            </div>
            <div class="meta-box">
                <h4>التاريخ</h4>
                <p id="invoiceDate">—</p>
            </div>
            <div class="meta-box">
                <h4>البائع</h4>
                <p>شركة درة فارس الشمال</p>
            </div>
            <div class="meta-box">
                <h4>الرقم الضريبي</h4>
                <p>300000000000003</p>
            </div>
        </div>

        <div class="qr-section">
            <div class="qr-code" id="qrCode">
                <!-- QR Code will be rendered here -->
                <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#333;font-size:14px">جاري التحميل...</div>
            </div>
            <div id="zatcaStatus" class="status-badge status-pending">⏳ بانتظار الإرسال لـ ZATCA</div>
            <p style="margin-top:12px;font-size:13px;color:rgba(255,255,255,0.6)">امسح الكود للتحقق من الفاتورة على منصة الهيئة</p>
        </div>

        <div id="invoiceDetails">
            <!-- Invoice items loaded dynamically -->
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="downloadPDF()">📄 تحميل PDF</button>
            <button class="btn btn-secondary" onclick="sendEmail()">📧 إرسال بالبريد</button>
            <button class="btn btn-secondary" onclick="shareWhatsApp()">📱 مشاركة واتساب</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://kcbmvxuzjlaooknwhqqb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjYm12eHV6amxhb29rbndocXFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NzkyMjAsImV4cCI6MjA5OTU1NTIyMH0.ayDpkfCKL90GcUKjbHQs7OvS5sxF1VSraWg58NHJ7ek';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const invoiceId = urlParams.get('id');

        async function loadInvoice() {
            if (!invoiceId) {
                document.getElementById('invoiceDetails').innerHTML = '<div style="text-align:center;padding:40px">❌ رقم الفاتورة غير موجود</div>';
                return;
            }

            const { data: invoice, error } = await supabaseClient
                .from('invoices')
                .select('*')
                .eq('id', invoiceId)
                .single();

            if (error || !invoice) {
                document.getElementById('invoiceDetails').innerHTML = '<div style="text-align:center;padding:40px">❌ الفاتورة غير موجودة</div>';
                return;
            }

            document.getElementById('invoiceNumber').textContent = invoice.invoice_number;
            document.getElementById('invoiceDate').textContent = new Date(invoice.created_at).toLocaleDateString('ar-SA');

            // Generate QR Code
            if (invoice.qr_code && window.QRCode) {
                QRCode.toCanvas(document.getElementById('qrCode'), invoice.qr_code, {
                    width: 180,
                    margin: 2,
                    color: { dark: '#000', light: '#fff' }
                });
            }

            // Update status
            const statusEl = document.getElementById('zatcaStatus');
            if (invoice.status === 'clearance') {
                statusEl.className = 'status-badge status-cleared';
                statusEl.textContent = '✅ تم Clearance';
            } else if (invoice.status === 'reporting') {
                statusEl.className = 'status-badge status-reported';
                statusEl.textContent = '✅ تم Reporting';
            }

            // Show details
            document.getElementById('invoiceDetails').innerHTML = `
                <div style="margin-top:20px">
                    <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1)">
                        <span>المجموع الفرعي</span>
                        <span>${Number(invoice.subtotal).toLocaleString('ar-SA')} ر.س</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1)">
                        <span>ضريبة القيمة المضافة (15%)</span>
                        <span>${Number(invoice.vat_total).toLocaleString('ar-SA')} ر.س</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:16px 0;font-size:20px;font-weight:800">
                        <span>الإجمالي</span>
                        <span>${Number(invoice.total).toLocaleString('ar-SA')} ر.س</span>
                    </div>
                </div>
            `;
        }

        function downloadPDF() {
            alert('📄 جاري إعداد ملف PDF...');
            // PDF generation would be implemented with a library like jsPDF
        }

        function sendEmail() {
            alert('📧 سيتم إرسال الفاتورة إلى بريدك الإلكتروني');
        }

        function shareWhatsApp() {
            const text = `فاتورتك من درة فارس الشمال: ${window.location.href}`;
            window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
        }

        loadInvoice();
    </script>
</body>
</html>
