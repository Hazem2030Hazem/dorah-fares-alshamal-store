<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الشراء | شركة درة فارس الشمال</title>
  <script src="analytics.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #0f0c29, #1a1a2e, #16213e); color: #fff; min-height: 100vh; }
        .checkout-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .checkout-header { text-align: center; margin-bottom: 30px; }
        .checkout-header h1 { font-size: 32px; font-weight: 900; margin-bottom: 10px; color: #fff; }
        .checkout-header p { color: rgba(255,255,255,0.7); }
        
        .progress-bar { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 40px; }
        .step { display: flex; align-items: center; gap: 8px; }
        .step-num { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; background: #E5E7EB; color: #9CA3AF; transition: 0.3s; }
        .step-num.active { background: #10B981; color: #fff; }
        .step-label { font-weight: 700; font-size: 13px; color: #9CA3AF; }
        .step-label.active { color: #10B981; }
        .step-line { width: 60px; height: 2px; background: #E5E7EB; margin: 0 10px; transition: 0.3s; }
        .step-line.active { background: #10B981; }
        
        .checkout-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; margin-bottom: 20px; backdrop-filter: blur(10px); }
        .checkout-card h3 { font-size: 20px; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: #fff; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 6px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; font-family: inherit; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #10B981; }
        
        .payment-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .payment-option { padding: 15px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1); text-align: center; cursor: pointer; transition: 0.3s; }
        .payment-option:hover, .payment-option.selected { border-color: #10B981; background: rgba(16,185,129,0.1); }
        .payment-option .icon { font-size: 28px; display: block; margin-bottom: 6px; }
        .payment-option .name { font-weight: 700; font-size: 13px; }
        
        .delivery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .delivery-option { padding: 20px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1); text-align: center; cursor: pointer; transition: 0.3s; }
        .delivery-option:hover, .delivery-option.selected { border-color: #10B981; background: rgba(16,185,129,0.1); }
        
        .cart-item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .cart-item img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; }
        .cart-item-info { flex: 1; }
        .cart-item-info h4 { font-size: 14px; margin-bottom: 2px; }
        .cart-item-info span { font-size: 12px; color: rgba(255,255,255,0.5); }
        .cart-item-price { font-weight: 800; color: #10B981; }
        
        .total-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 14px; color: rgba(255,255,255,0.7); }
        .total-row.final { border-top: 2px solid rgba(255,255,255,0.1); margin-top: 10px; padding-top: 15px; font-size: 20px; font-weight: 900; color: #10B981; }
        
        .btn-submit { width: 100%; padding: 16px; background: linear-gradient(135deg, #10B981, #059669); color: #fff; border: none; border-radius: 14px; font-size: 18px; font-weight: 800; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(16,185,129,0.3); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .empty-cart { text-align: center; padding: 80px 20px; }
        .empty-cart .icon { font-size: 80px; margin-bottom: 20px; }
        
        /* 🛍️ Cross-sell & Upsell */
        .upsell-section { margin-top: 20px; padding: 20px; background: rgba(59,130,246,0.05); border-radius: 16px; border: 1px solid rgba(59,130,246,0.2); }
        .upsell-section h4 { font-size: 16px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; color: #60A5FA; }
        .upsell-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .upsell-item { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .upsell-item:hover { border-color: #3B82F6; background: rgba(59,130,246,0.1); }
        .upsell-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        .upsell-item .price { color: #10B981; font-weight: 800; font-size: 14px; }
        .upsell-item .btn-add { margin-top: 8px; padding: 6px 14px; background: #3B82F6; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; }
        
        @media (max-width: 768px) {
            .form-row, .payment-grid, .delivery-grid { grid-template-columns: 1fr; }
            .progress-bar { font-size: 12px; }
            .step-line { width: 30px; }
        }
          /* 💳 بوابات الدفع السريعة */
        .quick-pay-section { margin-top: 15px; padding: 20px; background: rgba(99,102,241,0.05); border-radius: 16px; border: 1px solid rgba(99,102,241,0.2); }
        .quick-pay-section h4 { font-size: 16px; margin-bottom: 15px; color: #818CF8; }
        .quick-pay-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .quick-pay-btn { padding: 15px 10px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); text-align: center; cursor: pointer; transition: 0.3s; color: #fff; font-family: inherit; font-size: 12px; font-weight: 700; }
        .quick-pay-btn:hover { transform: translateY(-3px); }
        .quick-pay-btn.stc { border-color: #8B5CF6; background: rgba(139,92,246,0.1); }
        .quick-pay-btn.stc:hover { background: rgba(139,92,246,0.3); box-shadow: 0 8px 25px rgba(139,92,246,0.3); }
        .quick-pay-btn.apple { border-color: #000; background: rgba(0,0,0,0.3); color: #fff; }
        .quick-pay-btn.apple:hover { background: rgba(0,0,0,0.6); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .quick-pay-btn.mada { border-color: #10B981; background: rgba(16,185,129,0.1); }
        .quick-pay-btn.mada:hover { background: rgba(16,185,129,0.3); box-shadow: 0 8px 25px rgba(16,185,129,0.3); }
        .quick-pay-btn.tamara { border-color: #F59E0B; background: rgba(245,158,11,0.1); }
        .quick-pay-btn.tamara:hover { background: rgba(245,158,11,0.3); box-shadow: 0 8px 25px rgba(245,158,11,0.3); }
        .quick-pay-icon { font-size: 32px; display: block; margin-bottom: 6px; }
        /* ============================================================
           🏢 FORMAL CHECKOUT REDESIGN — طابع رسمي بمستوى الشركات العالمية
           ============================================================ */
        .checkout-header h1 { display: flex; align-items: center; justify-content: center; gap: 12px; letter-spacing: 0.3px; }
        .checkout-card { background: #14122B; border: 1px solid #272452; border-radius: 14px; box-shadow: 0 3px 14px rgba(0,0,0,0.28); backdrop-filter: none; }
        .checkout-card h3 { font-size: 17px; letter-spacing: 0.2px; padding-bottom: 12px; border-bottom: 1px solid #272452; margin-bottom: 18px; color: #F3F4F6; }
        .checkout-card h4 { color: #C7CBE8; }
        .form-group label { font-size: 13px; color: #B9BCE0; font-weight: 700; }
        .form-group input, .checkout-card input, .checkout-card select { background: #0E0C22 !important; border: 1px solid #322E66 !important; border-radius: 10px !important; color: #F3F4F6 !important; transition: border-color 0.2s; }
        .form-group input:focus, .checkout-card input:focus { border-color: #10B981 !important; outline: none; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }

        /* 💳 طرق الدفع — بلاطات بيضاء رسمية بالشعارات */
        .payment-option { background: #FFFFFF; border: 2px solid #E5E7EB; border-radius: 12px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 86px; position: relative; }
        .payment-option .icon { font-size: unset; display: flex; align-items: center; justify-content: center; min-height: 32px; margin-bottom: 0; }
        .payment-option .name { color: #111827; font-weight: 800; font-size: 12.5px; }
        .payment-option:hover { border-color: #9CA3AF; transform: none; }
        .payment-option.selected { border-color: #0B7A4B; background: #F0FBF5; box-shadow: 0 0 0 3px rgba(11,122,75,0.12); }
        .payment-option.selected::after { content: ''; position: absolute; top: 6px; left: 6px; width: 18px; height: 18px; border-radius: 50%; background: #0B7A4B url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>') center/11px no-repeat; }

        /* 🚚 طريقة الاستلام — بلاطات رسمية */
        .delivery-option { display: flex; flex-direction: column; align-items: center; gap: 10px; color: #D5D8F0; border-radius: 12px; }
        .delivery-option svg { width: 26px; height: 26px; }
        .delivery-option span { font-weight: 800; font-size: 14px; }
        .delivery-option.selected { color: #fff; }

        /* ⚡ الدفع السريع — بلاطات بيضاء بالشعارات الرسمية */
        .quick-pay-section { background: #14122B; border: 1px solid #272452; }
        .quick-pay-section h4 { display: flex; align-items: center; gap: 8px; color: #F3F4F6; font-size: 15px; }
        .quick-pay-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .quick-pay-btn { background: #FFFFFF; border: 2px solid #E5E7EB; border-radius: 12px; color: #111827; font-size: 11.5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 13px 8px; min-height: 84px; }
        .quick-pay-btn svg { width: 46px; height: 31px; }
        .quick-pay-btn:hover { border-color: #9CA3AF; transform: none; box-shadow: none; }
        .quick-pay-btn.stc, .quick-pay-btn.apple, .quick-pay-btn.mada, .quick-pay-btn.tamara { background: #FFFFFF; border-color: #E5E7EB; }

        /* ✅ زرار تأكيد الطلب */
        .btn-submit { display: flex; align-items: center; justify-content: center; gap: 10px; background: #0B7A4B; border-radius: 12px; letter-spacing: 0.4px; font-size: 17px; box-shadow: 0 4px 14px rgba(11,122,75,0.35); }
        .btn-submit:hover { background: #096A41; }

        /* 🏦 صندوق الحسابات البنكية */
        #bankAccountsBox > div[style*="rgba(255,255,255,.05)"], #bankAccountsBox > div[style*="rgba(255,255,255,0.05)"] { background: #FFFFFF !important; border-color: #E5E7EB !important; }

        @media (max-width: 640px) {
            .quick-pay-grid { grid-template-columns: repeat(2, 1fr); }
            .payment-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>

    <!-- ===== تصميم ضوء القمر الرسمي — الأزرار الزجاجية المتوهجة ===== -->
    <style>
        .dtrack-btn, .btn-submit, .otp-btn, .quick-pay-btn, .btn.btn-primary, .btn.btn-retry {
            display: inline-flex !important; align-items: center; justify-content: center; gap: 8px;
            background: rgba(255,255,255,.1) !important;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(220,232,255,.25) !important;
            color: #EDF3FF !important;
            border-radius: 12px !important;
            font-weight: 800 !important;
            transition: all .3s;
            box-shadow: 0 0 18px rgba(168,197,255,.12), inset 0 1px 0 rgba(255,255,255,.15) !important;
            text-shadow: 0 0 14px rgba(220,232,255,.25);
        }
        .dtrack-btn:hover, .btn-submit:hover, .otp-btn:hover, .quick-pay-btn:hover, .btn.btn-primary:hover, .btn.btn-retry:hover {
            background: rgba(255,255,255,.18) !important;
            border-color: rgba(255,255,255,.55) !important;
            color: #FFFFFF !important;
            box-shadow: 0 0 28px rgba(255,255,255,.35), 0 0 60px rgba(168,197,255,.2), inset 0 1px 0 rgba(255,255,255,.25) !important;
            transform: translateY(-2px);
        }
        .dtrack-btn svg, .btn-submit svg, .otp-btn svg, .quick-pay-btn svg, .btn.btn-primary svg, .btn.btn-retry svg {
            filter: drop-shadow(0 0 4px rgba(255,255,255,.4));
        }
        .btn.btn-secondary, .btn-add {
            display: inline-flex !important; align-items: center; justify-content: center; gap: 8px;
            background: rgba(255,255,255,.06) !important;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(220,232,255,.18) !important;
            color: #C7D6F5 !important;
            border-radius: 12px !important;
            font-weight: 700 !important;
            transition: all .3s;
            box-shadow: 0 0 12px rgba(168,197,255,.08) !important;
        }
        .btn.btn-secondary:hover, .btn-add:hover {
            background: rgba(255,255,255,.14) !important;
            border-color: rgba(255,255,255,.45) !important;
            box-shadow: 0 0 22px rgba(255,255,255,.3) !important;
            color: #FFFFFF !important;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="checkout-container">
    <div class="checkout-header">
        <h1><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> إتمام الشراء</h1>
        <p>أكمل بياناتك لتأكيد الطلب</p>
    </div>

    <div class="progress-bar">
        <div class="step"><div class="step-num active" id="step1Num">1</div><span class="step-label active" id="step1Label">السلة</span></div>
        <div class="step-line" id="line1"></div>
        <div class="step"><div class="step-num" id="step2Num">2</div><span class="step-label" id="step2Label">البيانات</span></div>
        <div class="step-line" id="line2"></div>
        <div class="step"><div class="step-num" id="step3Num">3</div><span class="step-label" id="step3Label">الدفع</span></div>
    </div>

    <div id="checkoutContent">
        <div class="empty-cart">
            <div class="icon">🛒</div>
            <h2>السلة فارغة</h2>
            <p>أضف منتجات إلى السلة أولاً</p>
            <a href="index.html" style="color:#10B981;font-weight:700;text-decoration:none">🛍️ تصفح المنتجات</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="core-utils.js"></script>
<script src="nav-fixes.js"></script>
<script src="floating-logos.js" defer></script>
<script src="theme.js"></script>
<script src="audio-volume.js" defer></script>
<script src="site-settings.js"></script>
<script src="ui-utils.js"></script>
<script src="auth.js"></script>
<script src="cart.js"></script>
<script src="products.js"></script>
<script src="wishlist-compare.js"></script>
<script src="main.js"></script>
<script>
// ===== حارس حالة المتجر: إيقاف البيع = منع الوصول لصفحة الدفع =====
// يستخدم Edge Function get-site-settings بدلاً من REST API المباشر لعدم exposing الـ anon key.
(async function() {
    try {
        var r = await fetch(window.SUPABASE_URL + '/functions/v1/get-site-settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });
        var data = await r.json();
        if (data.ok && data.settings && data.settings.storeStatus === 'open') return; // البيع مفعّل — أكمل عادي
    } catch(_) { /* عند الشك: امنع */ }
    document.body.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;font-family:inherit">'
        + '<div style="font-size:64px;margin-bottom:16px">🔒</div>'
        + '<h1 style="font-size:26px;margin-bottom:12px">المتجر تحت التجهيز حالياً</h1>'
        + '<p style="color:#AAB4CC;line-height:2;max-width:420px">نعمل على تجهيز المنتجات وتجربة شراء مثالية — البيع يبدأ قريباً بإذن الله.<br>يمكنك تصفح المنتجات في أي وقت.</p>'
        + '<a href="index.html" style="display:inline-block;margin-top:24px;background:rgba(255,255,255,.1);border:1px solid rgba(220,232,255,.25);color:#EDF3FF;padding:14px 32px;border-radius:12px;text-decoration:none;font-weight:800;box-shadow:0 0 18px rgba(168,197,255,.12)">🏠 العودة للرئيسية</a>'
        + '</div>';
    throw new Error('store-closed');
})();
</script>
    <script src="checkout.js"></script>
<script src="chatbot-ai.js" defer></script>
<script src="site-content.js" defer></script>
</body>
