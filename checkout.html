<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الشراء | شركة درة فارس الشمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #0f0c29, #1a1a2e, #16213e); color: #fff; min-height: 100vh; }
        .checkout-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .checkout-header { text-align: center; margin-bottom: 30px; }
        .checkout-header h1 { font-size: 32px; font-weight: 900; margin-bottom: 10px; color: #fff; }
        .checkout-header p { color: rgba(255,255,255,0.7); }
        
        .progress-bar { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 40px; }
        .step { display: flex; align-items: center; gap: 8px; }
        .step-num { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; background: #E5E7EB; color: #9CA3AF; transition: 0.3s; }
        .step-num.active { background: #10B981; color: #fff; }
        .step-label { font-weight: 700; font-size: 13px; color: #9CA3AF; }
        .step-label.active { color: #10B981; }
        .step-line { width: 60px; height: 2px; background: #E5E7EB; margin: 0 10px; transition: 0.3s; }
        .step-line.active { background: #10B981; }
        
        .checkout-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; margin-bottom: 20px; backdrop-filter: blur(10px); }
        .checkout-card h3 { font-size: 20px; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: #fff; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 6px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; font-family: inherit; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #10B981; }
        
        .payment-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .payment-option { padding: 15px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1); text-align: center; cursor: pointer; transition: 0.3s; }
        .payment-option:hover, .payment-option.selected { border-color: #10B981; background: rgba(16,185,129,0.1); }
        .payment-option .icon { font-size: 28px; display: block; margin-bottom: 6px; }
        .payment-option .name { font-weight: 700; font-size: 13px; }
        
        .delivery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .delivery-option { padding: 20px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1); text-align: center; cursor: pointer; transition: 0.3s; }
        .delivery-option:hover, .delivery-option.selected { border-color: #10B981; background: rgba(16,185,129,0.1); }
        
        .cart-item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .cart-item img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; }
        .cart-item-info { flex: 1; }
        .cart-item-info h4 { font-size: 14px; margin-bottom: 2px; }
        .cart-item-info span { font-size: 12px; color: rgba(255,255,255,0.5); }
        .cart-item-price { font-weight: 800; color: #10B981; }
        
        .total-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 14px; color: rgba(255,255,255,0.7); }
        .total-row.final { border-top: 2px solid rgba(255,255,255,0.1); margin-top: 10px; padding-top: 15px; font-size: 20px; font-weight: 900; color: #10B981; }
        
        .btn-submit { width: 100%; padding: 16px; background: linear-gradient(135deg, #10B981, #059669); color: #fff; border: none; border-radius: 14px; font-size: 18px; font-weight: 800; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(16,185,129,0.3); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .empty-cart { text-align: center; padding: 80px 20px; }
        .empty-cart .icon { font-size: 80px; margin-bottom: 20px; }
        
        /* 🛍️ Cross-sell & Upsell */
        .upsell-section { margin-top: 20px; padding: 20px; background: rgba(59,130,246,0.05); border-radius: 16px; border: 1px solid rgba(59,130,246,0.2); }
        .upsell-section h4 { font-size: 16px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; color: #60A5FA; }
        .upsell-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .upsell-item { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .upsell-item:hover { border-color: #3B82F6; background: rgba(59,130,246,0.1); }
        .upsell-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        .upsell-item .price { color: #10B981; font-weight: 800; font-size: 14px; }
        .upsell-item .btn-add { margin-top: 8px; padding: 6px 14px; background: #3B82F6; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; }
        
        @media (max-width: 768px) {
            .form-row, .payment-grid, .delivery-grid { grid-template-columns: 1fr; }
            .progress-bar { font-size: 12px; }
            .step-line { width: 30px; }
        }
          /* 💳 بوابات الدفع السريعة */
        .quick-pay-section { margin-top: 15px; padding: 20px; background: rgba(99,102,241,0.05); border-radius: 16px; border: 1px solid rgba(99,102,241,0.2); }
        .quick-pay-section h4 { font-size: 16px; margin-bottom: 15px; color: #818CF8; }
        .quick-pay-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .quick-pay-btn { padding: 15px 10px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); text-align: center; cursor: pointer; transition: 0.3s; color: #fff; font-family: inherit; font-size: 12px; font-weight: 700; }
        .quick-pay-btn:hover { transform: translateY(-3px); }
        .quick-pay-btn.stc { border-color: #8B5CF6; background: rgba(139,92,246,0.1); }
        .quick-pay-btn.stc:hover { background: rgba(139,92,246,0.3); box-shadow: 0 8px 25px rgba(139,92,246,0.3); }
        .quick-pay-btn.apple { border-color: #000; background: rgba(0,0,0,0.3); color: #fff; }
        .quick-pay-btn.apple:hover { background: rgba(0,0,0,0.6); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .quick-pay-btn.mada { border-color: #10B981; background: rgba(16,185,129,0.1); }
        .quick-pay-btn.mada:hover { background: rgba(16,185,129,0.3); box-shadow: 0 8px 25px rgba(16,185,129,0.3); }
        .quick-pay-btn.tamara { border-color: #F59E0B; background: rgba(245,158,11,0.1); }
        .quick-pay-btn.tamara:hover { background: rgba(245,158,11,0.3); box-shadow: 0 8px 25px rgba(245,158,11,0.3); }
        .quick-pay-icon { font-size: 32px; display: block; margin-bottom: 6px; }
    </style>
</head>
<body>

<div class="checkout-container">
    <div class="checkout-header">
        <h1>🛒 إتمام الشراء</h1>
        <p>أكمل بياناتك لتأكيد الطلب</p>
    </div>

    <div class="progress-bar">
        <div class="step"><div class="step-num active" id="step1Num">1</div><span class="step-label active" id="step1Label">السلة</span></div>
        <div class="step-line" id="line1"></div>
        <div class="step"><div class="step-num" id="step2Num">2</div><span class="step-label" id="step2Label">البيانات</span></div>
        <div class="step-line" id="line2"></div>
        <div class="step"><div class="step-num" id="step3Num">3</div><span class="step-label" id="step3Label">الدفع</span></div>
    </div>

    <div id="checkoutContent">
        <div class="empty-cart">
            <div class="icon">🛒</div>
            <h2>السلة فارغة</h2>
            <p>أضف منتجات إلى السلة أولاً</p>
            <a href="index.html" style="color:#10B981;font-weight:700;text-decoration:none">🛍️ تصفح المنتجات</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="main.js"></script>
<script>
// ✅ نطاق محلي (IIFE) لتجنب تعارض المتغيرات العامة مع main.js (cart / COUPONS / activeCoupon)
// والدوال المطلوبة من onclick تُصدَّر إلى window في نهاية السكريبت
(function() {
var cart = JSON.parse(localStorage.getItem('doraCart') || '[]');
  // دالة الإشعارات
function showToast(msg, type) {
    var toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#10B981;color:white;padding:14px 28px;border-radius:14px;z-index:99999;font-weight:700;font-size:15px;box-shadow:0 10px 40px rgba(16,185,129,0.4);animation:slideUp 0.3s ease;text-align:center;max-width:90%';
    if (type === 'warning') toast.style.background = '#F59E0B';
    if (type === 'error') toast.style.background = '#EF4444';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(function() { toast.remove(); }, 3000);
}

// أضف Animation CSS
var toastStyle = document.createElement('style');
toastStyle.textContent = '@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}';
document.head.appendChild(toastStyle);  
var deliveryMethod = 'delivery';
var selectedPayment = null;
var activeCoupon = null;
var COUPONS = {
    'DORA10': { discount: 0.10, label: 'خصم 10%' },
    'DORA20': { discount: 0.20, label: 'خصم 20%' },
    'WELCOME': { discount: 0.15, label: 'خصم ترحيبي 15%' }
};

// ============================================================
// 🚚 رسوم الشحن — تُقرأ من جدول shipping_rates في Supabase
// ============================================================
// ✏️ السعر الافتراضي الثابت (ر.س) — يُستخدم لو الجدول فاضي/محظور أو فشل الجلب
var SHIPPING_FALLBACK_COST = 25;
var shippingRatesCache = null; // null = لم يُجلب بعد
var shippingCost = 0;

// جلب الأسعار مرة واحدة مع try/catch شامل — الفشل = مصفوفة فارغة (بدون كسر)
async function ensureShippingRates() {
    if (shippingRatesCache !== null) return shippingRatesCache;
    try {
        if (typeof supabaseClient === 'undefined' || !supabaseClient) throw new Error('no supabase');
        var result = await supabaseClient.from('shipping_rates').select('*');
        if (result.error) throw result.error;
        shippingRatesCache = result.data || [];
    } catch (e) {
        shippingRatesCache = [];
    }
    return shippingRatesCache;
}

// مطابقة المدينة مع الأسعار: سعر المدينة ← السعر الافتراضي بالجدول ← الثابت
function calcShippingFromRates(rates, city) {
    try {
        if (!rates || !rates.length) return SHIPPING_FALLBACK_COST;
        var normalized = (city || '').trim();
        var defaultPrice = null;
        for (var i = 0; i < rates.length; i++) {
            var r = rates[i];
            var rCity = String(r.to_city || r.city || r.city_name || '').trim();
            var rawPrice = (r.price_sar != null ? r.price_sar : (r.price != null ? r.price : (r.cost != null ? r.cost : r.rate)));
            var price = Number(rawPrice);
            if (isNaN(price)) continue;
            var isDefault = r.is_default === true ||
                ['default', '*', 'افتراضي', 'الكل', 'جميع المدن', 'أخرى', 'اخرى', ''].indexOf(rCity) !== -1;
            if (isDefault) { if (defaultPrice === null) defaultPrice = price; continue; }
            if (normalized && rCity && (rCity === normalized || rCity.indexOf(normalized) !== -1 || normalized.indexOf(rCity) !== -1)) {
                return price; // ✅ وُجد سعر للمدينة
            }
        }
        if (defaultPrice !== null) return defaultPrice; // ✅ السعر الافتراضي من الجدول
        return SHIPPING_FALLBACK_COST; // ✏️ الثابت الافتراضي
    } catch (e) {
        return SHIPPING_FALLBACK_COST;
    }
}

// حساب رسوم الشحن الحالية (استلام من المتجر = 0)
function currentShippingCost() {
    if (deliveryMethod === 'pickup') return 0;
    var cityEl = document.getElementById('custCity');
    return calcShippingFromRates(shippingRatesCache, cityEl ? cityEl.value : '');
}

// مجاميع الطلب (مصدر واحد للحقيقة)
function calcOrderTotals() {
    var subtotal = cart.reduce(function(s, i) { return s + (i.price * i.qty); }, 0);
    var tax = Math.round(subtotal * 0.15);
    var discount = activeCoupon ? Math.round(subtotal * activeCoupon.discount) : 0;
    return { subtotal: subtotal, tax: tax, discount: discount, finalTotal: subtotal + tax - discount + shippingCost };
}

// تحديث سطر الشحن والإجمالي ديناميكياً بدون إعادة رسم الصفحة (يحافظ على مدخلات العميل)
async function updateShipping() {
    try {
        await ensureShippingRates();
        shippingCost = currentShippingCost();
        var t = calcOrderTotals();
        var shipEl = document.getElementById('shippingCostValue');
        var totalEl = document.getElementById('finalTotalValue');
        if (shipEl) {
            shipEl.textContent = deliveryMethod === 'pickup'
                ? 'مجاناً (استلام من المتجر)'
                : shippingCost.toLocaleString() + ' ر.س';
        }
        if (totalEl) totalEl.textContent = t.finalTotal.toLocaleString() + ' ر.س';
        // تحديث مبالغ أزرار الدفع السريع لتشمل الشحن
        var quickBtns = { stc: 'payWithSTC', apple: 'payWithApple', mada: 'payWithMada', tamara: 'payWithTamara' };
        Object.keys(quickBtns).forEach(function(key) {
            var btn = document.querySelector('.quick-pay-btn.' + key);
            if (btn) btn.setAttribute('onclick', quickBtns[key] + '(' + t.finalTotal + ')');
        });
    } catch (e) { /* صمت تام — لا نكسر الصفحة */ }
}

function renderCheckout() {
    var container = document.getElementById('checkoutContent');
    if (!cart.length) return;
    
    shippingCost = currentShippingCost(); // 🚚 حساب متزامن من الكاش/الافتراضي، وتُحدَّث لاحقاً عبر updateShipping
    var totals = calcOrderTotals();
    var subtotal = totals.subtotal, tax = totals.tax, discount = totals.discount, finalTotal = totals.finalTotal;
    
    container.innerHTML = `
        <div class="checkout-card">
            <h3>📦 ملخص الطلب</h3>
            ${cart.map(function(item) {
                return '<div class="cart-item"><img src="' + (item.image || 'https://via.placeholder.com/50') + '" onerror="this.style.display=\'none\'"><div class="cart-item-info"><h4>' + item.name + '</h4><span>الكمية: ' + item.qty + ' | ' + item.price.toLocaleString() + ' ر.س</span></div><div class="cart-item-price">' + (item.price * item.qty).toLocaleString() + ' ر.س</div></div>';
            }).join('')}
            <div class="total-row"><span>المجموع الفرعي</span><span>${subtotal.toLocaleString()} ر.س</span></div>
            <div class="total-row"><span>الضريبة (15%)</span><span>${tax.toLocaleString()} ر.س</span></div>
            <div class="total-row"><span>🚚 رسوم الشحن</span><span id="shippingCostValue">${deliveryMethod === 'pickup' ? 'مجاناً (استلام من المتجر)' : shippingCost.toLocaleString() + ' ر.س'}</span></div>
            ${discount > 0 ? '<div class="total-row" style="color:#10B981"><span>الخصم (' + activeCoupon.label + ')</span><span>-' + discount.toLocaleString() + ' ر.س</span></div>' : ''}
            <div class="total-row final"><span>المجموع الكلي</span><span id="finalTotalValue">${finalTotal.toLocaleString()} ر.س</span></div>
        </div>
        
        <!-- 🛍️ Cross-sell: منتجات مقترحة -->
        <div class="upsell-section">
            <h4>🎯 قد تحتاج أيضاً</h4>
            <div class="upsell-grid" id="upsellGrid">⏳ جاري التحميل...</div>
        </div>
        
        <div class="checkout-card">
            <h3>🏷️ كود خصم</h3>
            <div style="display:flex;gap:10px">
                <input type="text" id="couponCode" placeholder="أدخل كود الخصم" style="flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:#fff;font-family:inherit">
                <button onclick="applyCouponCode()" style="padding:12px 20px;background:#10B981;color:#fff;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-family:inherit">تطبيق</button>
            </div>
            <div id="couponMsg" style="margin-top:8px;font-size:13px;font-weight:700"></div>
        </div>
        
        <div class="checkout-card">
            <h3>👤 بياناتك</h3>
            <div class="form-row">
                <div class="form-group"><label>الاسم الكامل *</label><input type="text" id="custName" required></div>
                <div class="form-group"><label>رقم الجوال *</label><input type="tel" id="custPhone" required></div>
            </div>
            <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="custEmail"></div>
            <div class="form-row">
                <div class="form-group"><label>المدينة</label><input type="text" id="custCity"></div>
                <div class="form-group"><label>العنوان</label><input type="text" id="custAddress"></div>
            </div>
        </div>
        
        <div class="checkout-card">
            <h3>🚚 طريقة الاستلام</h3>
            <div class="delivery-grid">
                <div class="delivery-option selected" onclick="selectDelivery('delivery', this)">🚚 توصيل للمنزل</div>
                <div class="delivery-option" onclick="selectDelivery('pickup', this)">🏬 استلام من المتجر</div>
            </div>
        </div>
        
        <div class="checkout-card">
            <h3>💳 طريقة الدفع</h3>
            <div class="payment-grid" id="paymentMethodsGrid">⏳ جاري تحميل طرق الدفع...</div>
        </div>
        
              <!-- 💳 بوابات الدفع السريعة -->
        <div class="quick-pay-section">
            <h4>⚡ دفع سريع</h4>
            <div class="quick-pay-grid">
                <button class="quick-pay-btn stc" onclick="payWithSTC(${finalTotal})">
                    <span class="quick-pay-icon">💜</span>
                    STC Pay
                </button>
                <button class="quick-pay-btn apple" onclick="payWithApple(${finalTotal})">
                    <span class="quick-pay-icon">🍎</span>
                    Apple Pay
                </button>
                <button class="quick-pay-btn mada" onclick="payWithMada(${finalTotal})">
                    <span class="quick-pay-icon">💚</span>
                    مدى أثير
                </button>
                <button class="quick-pay-btn tamara" onclick="payWithTamara(${finalTotal})">
                    <span class="quick-pay-icon">🧡</span>
                    تمارا
                </button>
            </div>
        </div>
        <button class="btn-submit" onclick="placeOrder()">📨 تأكيد الطلب</button>
    `;
    
    loadPaymentMethods();
    loadUpsellProducts();
    
    // 🚚 تحديث الشحن عند تغيير المدينة + جلب الأسعار أول مرة
    var cityInput = document.getElementById('custCity');
    if (cityInput) cityInput.addEventListener('input', function() { updateShipping(); });
    updateShipping();
}

function selectDelivery(method, el) {
    deliveryMethod = method;
    document.querySelectorAll('.delivery-option').forEach(function(o) { o.classList.remove('selected'); });
    el.classList.add('selected');
    updateShipping(); // 🚚 استلام من المتجر = 0 / توصيل = حسب المدينة
}

async function loadPaymentMethods() {
    var grid = document.getElementById('paymentMethodsGrid');
    var result = await supabaseClient.from('payment_methods').select('*').eq('is_active', true).order('sort_order');
    var methods = result.data || [];

    // 💳 البوابات الإلكترونية المفعلة — تُقرأ من الـ View العامة payment_gateways_public فقط
    // (جدول payment_gateways محمي RLS ولا يقرأه الفرونت إطلاقاً — لا أسرار هنا)
    var gateways = [];
    try {
        var gwResult = await supabaseClient.from('payment_gateways_public').select('*');
        if (!gwResult.error && gwResult.data) gateways = gwResult.data;
    } catch (eGw) { gateways = []; } // صمت تام — غياب البوابات لا يكسر طرق الدفع الحالية

    if (!methods.length && !gateways.length) { grid.innerHTML = '<div style="text-align:center;padding:20px;grid-column:1/-1">💳 لا توجد طرق دفع</div>'; return; }
    var html = methods.map(function(m) {
        return '<div class="payment-option" onclick="selectPayment(\'' + m.id + '\',\'' + m.name + '\', this)"><span class="icon">' + (m.icon || '💳') + '</span><span class="name">' + m.name + '</span></div>';
    }).join('');
    html += gateways.map(function(g) {
        // شارة 🧪 للوضع التجريبي — تنظيف النصوص من علامات الاقتباس حمايةً للـ onclick
        var gCode = String(g.gateway_code || '').replace(/['"\\]/g, '');
        var gName = String(g.gateway_name || 'دفع إلكتروني').replace(/['"\\]/g, '');
        var gMode = String(g.mode || 'test').replace(/['"\\]/g, '');
        var badge = gMode === 'test' ? ' <span style="background:rgba(245,158,11,0.2);color:#F59E0B;font-size:10px;padding:2px 6px;border-radius:6px;vertical-align:middle">🧪 تجريبي</span>' : '';
        return '<div class="payment-option" onclick="selectGateway(\'' + gCode + '\',\'' + gName + '\',\'' + gMode + '\', this)"><span class="icon">💳</span><span class="name">دفع إلكتروني — ' + gName + badge + '</span></div>';
    }).join('');
    grid.innerHTML = html;
}

function selectGateway(code, name, mode, el) {

// 🛍️ Cross-sell: منتجات مقترحة
function loadUpsellProducts() {
    var grid = document.getElementById('upsellGrid');
    var cartCategories = cart.map(function(item) {
        var p = productsData.find(function(x) { return x.id === item.id; });
        return p ? p.category : null;
    }).filter(Boolean);
    
    var related = productsData.filter(function(p) {
        return cartCategories.indexOf(p.category) !== -1 && !cart.find(function(c) { return c.id === p.id; }) && p.stock > 0;
    }).slice(0, 3);
    
    if (!related.length) { grid.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.5)">لا توجد اقتراحات حالياً</p>'; return; }
    
    grid.innerHTML = related.map(function(p) {
        return '<div class="upsell-item"><img src="' + p.image + '" alt="' + p.name + '"><div style="font-size:12px;margin:4px 0">' + p.name.substring(0, 25) + '...</div><div class="price">' + p.price.toLocaleString() + ' ر.س</div><button class="btn-add" onclick="addToCartDirect(' + p.id + ', \'' + p.name + '\', ' + p.price + ', \'' + p.image + '\')">🛒 أضف</button></div>';
    }).join('');
}

// ============================================================
// 💳 مسار الدفع الإلكتروني — استدعاء Edge Function ثم تحويل العميل
// try/catch شامل: أي فشل = فولباك للمسار العادي (واتساب) بدون كسر أو إلغاء الطلب
// ============================================================
async function startGatewayPayment(orderId, amount, customer, gatewayCode) {
    try {
        // رابط العودة بعد الدفع — يُبنى من مسار الصفحة الحالية ليعمل على أي دومين/استضافة
        var callbackUrl = new URL('payment-return.html', window.location.href).href + '?order=' + encodeURIComponent(String(orderId));
        var res = await fetch('https://kcbmvxuzjlaooknwhqqb.supabase.co/functions/v1/create-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                order_id: String(orderId),
                amount: amount, // الإجمالي شامل الشحن
                currency: 'SAR',
                customer: customer,
                callback_url: callbackUrl,
                gateway_code: gatewayCode || undefined // اختياري — الفانكشن تختار المفعلة لو غاب
            })
        });
        if (!res.ok) throw new Error('function_status_' + res.status);
        var data = await res.json();
        if (!data || !data.payment_url) throw new Error('no_payment_url');
        window.location.href = data.payment_url; // 🚀 تحويل العميل لبوابة الدفع (أو المحاكي)
        return true;
    } catch (e) {
        // الفانكشن غير منشورة بعد / فشلت / الشبكة — رسالة ودّية بدون كسر
        showToast('⚠️ الدفع الإلكتروني غير متاح حالياً — اختر طريقة أخرى', 'warning');
        return false;
    }
}

async function placeOrder() {
    var name = document.getElementById('custName').value.trim();
    var phone = document.getElementById('custPhone').value.trim();
    if (!name || !phone) { alert('❌ الاسم والجوال مطلوبين'); return; }
    if (!selectedPayment) { alert('❌ اختر طريقة الدفع'); return; }
    
    var email = document.getElementById('custEmail').value.trim();
    var city = document.getElementById('custCity').value.trim();
    var address = document.getElementById('custAddress').value.trim();
    // 🚚 تأكيد رسوم الشحن النهائية قبل الإرسال (فشل الجلب = الافتراضي بدون كسر)
    await ensureShippingRates();
    shippingCost = currentShippingCost();
    var totals = calcOrderTotals();
    var subtotal = totals.subtotal, tax = totals.tax, discount = totals.discount, finalTotal = totals.finalTotal;
    
    var orderPayload = {
        customer_name: name, customer_phone: phone, customer_email: email,
        items: cart, subtotal: subtotal, tax: tax, shipping_cost: shippingCost, total: finalTotal,
        // 💳 مسار البوابة: pending_payment مبدئياً (فولباك new لو العمود/القيد يرفض)
        status: (selectedPayment.isGateway ? 'pending_payment' : 'new'), payment_method: selectedPayment.name,
        address: JSON.stringify({ city: city, address: address, delivery: deliveryMethod })
    };
    var orderResult = await supabaseClient.from('store_orders').insert([orderPayload]).select('*').single();
    if (orderResult.error) {
        // فولباك: لو عمود shipping_cost غير موجود بعد في جدول الطلبات — نحفظ الطلب بدونه بدون كسر
        try {
            var fallbackPayload = Object.assign({}, orderPayload);
            delete fallbackPayload.shipping_cost;
            orderResult = await supabaseClient.from('store_orders').insert([fallbackPayload]).select('*').single();
        } catch (eOrder) {}
    }
    if (orderResult.error && orderPayload.status !== 'new') {
        // فولباك إضافي: قيد على عمود status يرفض pending_payment — نحفظ الطلب كـ new
        try {
            var newPayload = Object.assign({}, orderPayload);
            delete newPayload.shipping_cost;
            newPayload.status = 'new';
            orderResult = await supabaseClient.from('store_orders').insert([newPayload]).select('*').single();
        } catch (eOrder2) {}
    }
    var orderId = orderResult.data ? orderResult.data.id : null;

    // 💳 مسار الدفع الإلكتروني: الطلب أُنشئ أولاً — الآن نستدعي الفانكشن ونحوّل العميل
    if (selectedPayment.isGateway) {
        var gatewayOk = false;
        if (orderId) {
            showToast('⏳ جاري تجهيز الدفع الإلكتروني...');
            gatewayOk = await startGatewayPayment(orderId, finalTotal, { name: name, email: email, phone: phone }, selectedPayment.gatewayCode);
        } else {
            showToast('⚠️ الدفع الإلكتروني غير متاح حالياً — اختر طريقة أخرى', 'warning');
        }
        if (gatewayOk) return; // التحويل لبوابة الدفع جارٍ — لا نكمل المسار العادي
        // ⚠️ فشل المسار الإلكتروني: الطلب يبقى محفوظاً ونكمل بمسار الواتساب العادي كفولباك
        // محاولة أفضل جهد لإرجاع حالة الطلب إلى new (كان pending_payment) — الفشل هنا غير مؤثر
        try {
            if (orderId) await supabaseClient.from('store_orders').update({ status: 'new' }).eq('id', orderId);
        } catch (eRevert) {}
    }

    var invoiceNumber = 'INV-' + Date.now();
    var invoiceResult = await supabaseClient.from('invoices').insert([{
        invoice_number: invoiceNumber, customer_name: name, customer_email: email,
        customer_phone: phone, items: cart, subtotal: subtotal, tax: tax, total: finalTotal, status: 'issued'
    }]).select('*').single();
    var invoiceId = invoiceResult.data ? invoiceResult.data.id : null;
    
    var msg = '*طلب جديد*\n\n*العميل:* ' + name + '\n*الجوال:* ' + phone + '\n*الدفع:* ' + selectedPayment.name + '\n*الشحن:* ' + shippingCost.toLocaleString() + ' ر.س' + '\n*الإجمالي:* ' + finalTotal.toLocaleString() + ' ر.س';
    if (invoiceId) msg += '\n\n🧾 الفاتورة: https://alshamal-df.com/invoice.html?id=' + invoiceId;
    window.open('https://wa.me/966545358773?text=' + encodeURIComponent(msg), '_blank');
    
    localStorage.removeItem('doraCart');
    var orderNumber = orderResult.data ? orderResult.data.id : '';
    window.location.href = 'thankyou.html?order=' + orderNumber + '&invoice=' + (invoiceId || '');
}
