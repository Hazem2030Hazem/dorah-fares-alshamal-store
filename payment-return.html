<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الدفع | شركة درة فارس الشمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #0f0c29, #1a1a2e); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .result-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 40px 30px; max-width: 550px; width: 100%; backdrop-filter: blur(10px); }
        .result-icon { font-size: 70px; margin-bottom: 15px; }
        .result-card h1 { font-size: 26px; font-weight: 900; margin-bottom: 8px; }
        .result-card p { color: rgba(255,255,255,0.7); font-size: 14px; margin-bottom: 18px; line-height: 1.7; }
        .success h1 { color: #10B981; }
        .failed h1 { color: #EF4444; }

        .order-number { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); padding: 12px; border-radius: 12px; font-size: 16px; font-weight: 800; color: #10B981; margin-bottom: 15px; }
        .status-note { font-size: 12px; color: rgba(255,255,255,0.45); margin-bottom: 18px; }

        .btn { display: inline-block; padding: 12px 25px; border-radius: 12px; font-weight: 700; text-decoration: none; margin: 5px; transition: 0.3s; font-size: 14px; }
        .btn-primary { background: linear-gradient(135deg, #10B981, #059669); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-retry { background: linear-gradient(135deg, #F59E0B, #D97706); color: #fff; }
        .btn:hover { transform: translateY(-2px); }
        .btn-whatsapp { background: #25D366; color: #fff; }
    </style>

    <!-- ===== تصميم ضوء القمر الرسمي — الأزرار الزجاجية المتوهجة ===== -->
    <style>
        .dtrack-btn, .btn-submit, .otp-btn, .quick-pay-btn, .btn.btn-primary, .btn.btn-retry {
            display: inline-flex !important; align-items: center; justify-content: center; gap: 8px;
            background: rgba(255,255,255,.1) !important;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(220,232,255,.25) !important;
            color: #EDF3FF !important;
            border-radius: 12px !important;
            font-weight: 800 !important;
            transition: all .3s;
            box-shadow: 0 0 18px rgba(168,197,255,.12), inset 0 1px 0 rgba(255,255,255,.15) !important;
            text-shadow: 0 0 14px rgba(220,232,255,.25);
        }
        .dtrack-btn:hover, .btn-submit:hover, .otp-btn:hover, .quick-pay-btn:hover, .btn.btn-primary:hover, .btn.btn-retry:hover {
            background: rgba(255,255,255,.18) !important;
            border-color: rgba(255,255,255,.55) !important;
            color: #FFFFFF !important;
            box-shadow: 0 0 28px rgba(255,255,255,.35), 0 0 60px rgba(168,197,255,.2), inset 0 1px 0 rgba(255,255,255,.25) !important;
            transform: translateY(-2px);
        }
        .dtrack-btn svg, .btn-submit svg, .otp-btn svg, .quick-pay-btn svg, .btn.btn-primary svg, .btn.btn-retry svg {
            filter: drop-shadow(0 0 4px rgba(255,255,255,.4));
        }
        .btn.btn-secondary, .btn-add {
            display: inline-flex !important; align-items: center; justify-content: center; gap: 8px;
            background: rgba(255,255,255,.06) !important;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(220,232,255,.18) !important;
            color: #C7D6F5 !important;
            border-radius: 12px !important;
            font-weight: 700 !important;
            transition: all .3s;
            box-shadow: 0 0 12px rgba(168,197,255,.08) !important;
        }
        .btn.btn-secondary:hover, .btn-add:hover {
            background: rgba(255,255,255,.14) !important;
            border-color: rgba(255,255,255,.45) !important;
            box-shadow: 0 0 22px rgba(255,255,255,.3) !important;
            color: #FFFFFF !important;
            transform: translateY(-2px);
        }
    </style>
    <link rel="stylesheet" href="assets/sky-premium.css">
    <style>
        /* Sky Premium — نتيجة الدفع: بطاقة زجاجية فاتحة + تحييد الأزرار الزجاجية الداكنة (!important) */
        body.sp-payreturn .result-card {
            background: var(--sp-glass-strong); border: 1px solid var(--sp-glass-brd);
            box-shadow: var(--sp-shadow);
        }
        body.sp-payreturn .result-card p { color: var(--sp-ink2); }
        body.sp-payreturn .status-note { color: var(--sp-muted); }
        body.sp-payreturn .btn.btn-primary, body.sp-payreturn .btn.btn-retry {
            background: var(--sp-primary) !important; border: 1px solid var(--sp-primary) !important;
            color: #fff !important; box-shadow: 0 8px 24px rgba(2,132,199,.35) !important; text-shadow: none;
        }
        body.sp-payreturn .btn.btn-primary:hover, body.sp-payreturn .btn.btn-retry:hover {
            background: var(--sp-primary-dark) !important; border-color: var(--sp-primary-dark) !important;
            color: #fff !important; box-shadow: 0 14px 32px rgba(2,132,199,.42) !important;
        }
        body.sp-payreturn .btn.btn-secondary {
            background: #fff !important; border: 1.5px solid var(--sp-glow) !important;
            color: var(--sp-primary) !important; box-shadow: 0 4px 14px rgba(2,132,199,.10) !important; text-shadow: none;
        }
        body.sp-payreturn .btn.btn-secondary:hover {
            background: var(--sp-sky100) !important; color: var(--sp-primary-dark) !important; border-color: var(--sp-glow) !important;
        }
    </style>
</head>
<body class="sp-payreturn">
    <div class="result-card" id="resultCard">
        <div class="result-icon" id="resultIcon">⏳</div>
        <h1 id="resultTitle">جاري معالجة نتيجة الدفع...</h1>
        <p id="resultMsg">يرجى الانتظار لحظة</p>
        <div class="order-number" id="orderNumber" style="display:none"></div>
        <div class="status-note" id="statusNote"></div>
        <div id="resultButtons"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
    <script>
        // 🔐 صفحة عرض فقط — لا أي كتابة مباشرة في قاعدة البيانات من المتصفح.
        // الحالة النهائية تأتي حصراً من Edge Function: verify-payment (تتحقق من البوابة سيرفرياً).
        (async function() {
            var params = new URLSearchParams(window.location.search);
            var orderId = params.get('order') || '';
            var paymentId = params.get('payment_id') || params.get('payment') || params.get('id') || '';
            var gateway = params.get('gateway') || 'moyasar';

            var card = document.getElementById('resultCard');
            var icon = document.getElementById('resultIcon');
            var title = document.getElementById('resultTitle');
            var msg = document.getElementById('resultMsg');
            var orderBox = document.getElementById('orderNumber');
            var note = document.getElementById('statusNote');
            var buttons = document.getElementById('resultButtons');

            if (orderId) {
                orderBox.style.display = 'block';
                orderBox.textContent = 'رقم الطلب: ' + orderId;
            }

            // ✅ حالة النجاح (مؤكدة من السيرفر)
            function showSuccess() {
                card.className = 'result-card success';
                icon.textContent = '🎉';
                title.textContent = 'تم الدفع بنجاح!';
                msg.textContent = 'شكراً لك — تم استلام دفعتك وسيتم تجهيز طلبك قريباً.';
                // 🧹 إفراغ السلة بعد الدفع المؤكد (حالة محلية فقط)
                try { localStorage.removeItem('doraCart'); } catch (e) {}
                buttons.innerHTML =
                    '<a href="track.html" class="btn btn-primary">📦 تتبع الطلب</a>' +
                    '<a href="account.html" class="btn btn-secondary">🧾 طلباتي وفواتيري</a>' +
                    '<br><a href="index.html" class="btn btn-secondary">🏠 العودة للرئيسية</a>';
            }

            // ❌ حالة الفشل (مؤكدة من السيرفر)
            function showFailed() {
                card.className = 'result-card failed';
                icon.textContent = '❌';
                title.textContent = 'فشلت عملية الدفع';
                msg.textContent = 'لم يتم خصم أي مبلغ. يمكنك إعادة المحاولة أو اختيار طريقة دفع أخرى — طلبك محفوظ ولم يُلغَ.';
                buttons.innerHTML =
                    '<a href="checkout.html" class="btn btn-retry">🔄 إعادة المحاولة</a>' +
                    '<br><a href="index.html" class="btn btn-secondary">🏠 العودة للرئيسية</a>';
            }

            // ⏳ قيد المعالجة / تعذر التحقق الفوري
            function showPending(extraNote) {
                card.className = 'result-card';
                icon.textContent = '⏳';
                title.textContent = 'الدفع قيد المعالجة';
                msg.textContent = 'جاري التحقق من نتيجة الدفع — سيتم تأكيد حالة طلبك تلقائياً فور اكتمالها.';
                note.textContent = extraNote || '';
                buttons.innerHTML =
                    '<a href="track.html" class="btn btn-primary">📦 تتبع الطلب</a>' +
                    '<br><a href="index.html" class="btn btn-secondary">🏠 العودة للرئيسية</a>';
            }

            if (!orderId) {
                showPending('لم يصلنا رقم الطلب — إن خُصم المبلغ تواصل معنا فوراً');
                return;
            }

            // 🔐 التحقق السيرفي من نتيجة الدفع
            try {
                var headers = { 'Content-Type': 'application/json' };
                try {
                    if (typeof supabaseClient !== 'undefined' && supabaseClient) {
                        var sr = await supabaseClient.auth.getSession();
                        var tok = sr && sr.data && sr.data.session && sr.data.session.access_token;
                        if (tok) headers['Authorization'] = 'Bearer ' + tok;
                    }
                } catch (eSess) {}
                var verifyUrl = (typeof SUPABASE_URL !== 'undefined' ? SUPABASE_URL : 'https://kcbmvxuzjlaooknwhqqb.supabase.co') + '/functions/v1/verify-payment';
                var res = await fetch(verifyUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ order_id: String(orderId), payment_id: paymentId || null, gateway: gateway })
                });
                var data = await res.json().catch(function() { return null; });
                var st = String((data && (data.payment_status || data.status)) || '').toLowerCase();
                if (st === 'paid' || st === 'success' || st === 'succeeded' || (data && data.success === true && st !== 'failed')) {
                    showSuccess();
                } else if (st === 'failed' || st === 'declined' || st === 'canceled' || st === 'cancelled') {
                    showFailed();
                } else {
                    showPending((data && data.message) || '');
                }
            } catch (e) {
                showPending('تعذر التحقق فوراً — سيتم تأكيد حالة الدفع تلقائياً');
            }
        })();
    </script>
    <script src="chatbot-ai.js"></script>
    <script src="site-content.js"></script>
</body>
</html>
