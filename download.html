<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق درة فارس الشمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            padding: 50px 30px;
            max-width: 500px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(14,165,233,0.3);
        }
        h1 { font-size: 28px; margin-bottom: 10px; }
        p { color: rgba(255,255,255,0.7); margin-bottom: 30px; font-size: 16px; }
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            padding: 18px 40px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 900;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(59,130,246,0.4);
            animation: pulse 2s infinite;
        }
        .download-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(59,130,246,0.6); }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 30px rgba(59,130,246,0.4); }
            50% { box-shadow: 0 8px 50px rgba(59,130,246,0.7); }
        }
        .features { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 30px 0; }
        .feature {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
        }
        .feature-icon { 
            width: 36px; 
            height: 36px; 
            display: block; 
            margin: 0 auto 8px;
            color: #0EA5E9;
            filter: drop-shadow(0 0 8px rgba(14,165,233,0.6));
        }
        .qr-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .qr-code {
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 15px;
            padding: 10px;
            margin: 15px auto;
        }
        .stores { display: flex; gap: 15px; justify-content: center; margin-top: 25px; flex-wrap: wrap; }
        .store-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        .store-btn:hover { background: rgba(255,255,255,0.2); }
        .store-btn svg { width: 20px; height: 20px; }
    </style>
  <meta name="theme-color" content="#0F0C29">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="درة فارس الشمال">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=5.0">
  <link rel="manifest" href="manifest.json?v=5.0">
</head>
<body>

</body>
</html>
